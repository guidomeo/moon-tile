<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiGolf</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

/* PAGE LAYOUT */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    

    background-image: url("img/Background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* LOGO */
.logo img {
    width: min(700px, 80vw);
    height: auto;
}

.widget {
    margin-bottom: 40px; /* gap SOLO qui */
}

.widget iframe {
    width: min(800px, 92vw);
    height: 190px;

    border: none;
    border-radius: 12px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.35);

    display: block;
}

/* FOOTER */
.footer a {
    color: #dff6ff;
    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    padding: 10px 18px;

    background: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(4px);

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
}

.footer a:hover {
    background: rgba(255,255,255,0.15);
    color: white;
}
</style>
</head>

<body>

    <div class="logo">
        <img src="img/Logo.png" alt="LogiGolf Logo">
    </div>

    <div class="widget">
        <iframe src="https://store.steampowered.com/widget/2388030/"></iframe>
    </div>

    <div class="footer">
        <a href="../presskit/LogiGolf/">Press Kit</a>
    </div>

</body>
</html>
